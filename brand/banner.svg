<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120">
  <rect width="1120" height="1120" fill="#16181C"/>
  <!-- Banner content is centred in a square canvas: macOS padding a rendered
       SVG to a square means a centre-crop is the only reliable way back to
       exactly 1120x548. -->
  <g transform="translate(0,286)">
    <rect width="1120" height="548" fill="#16181C"/>

    <g transform="translate(640,150)">
      <rect x="0" y="0"   width="180" height="30" rx="15" fill="#5D6266"/>
      <rect x="0" y="80"  width="264" height="30" rx="15" fill="#5D6266"/>
      <rect x="0" y="160" width="372" height="30" rx="15" fill="#C9553F"/>
      <path d="M300 -34 L300 240" stroke="#8A9099" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="20 22"/>
    </g>

    <g fill="#F4F2EE" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
      <text x="88" y="170" font-size="62" font-weight="700">Blocked Aging</text>
      <text x="88" y="222" font-size="30" font-weight="400" fill="#A9AEB3">for Jira</text>
      <text x="88" y="320" font-size="27" fill="#D8D5D0">Jira tells you what is blocked.</text>
      <text x="88" y="360" font-size="27" fill="#D8D5D0">This tells you what has been blocked</text>
      <text x="88" y="400" font-size="27" font-weight="700">for six weeks.</text>
      <text x="88" y="474" font-size="22" fill="#8A9099">Bellowsware</text>
    </g>
  </g>
</svg>
